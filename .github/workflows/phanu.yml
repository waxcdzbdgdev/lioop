name: 🟢 Pancung

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa'
        required: true
        default: '9988'

permissions:
  actions: write

jobs:
  run-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "hello world" & sleep 80

  trigger-khucluke:
    needs: run-hello
    runs-on: ubuntu-latest
    if: github.event.inputs.loop_count > 0
    steps:
      - name: Panggil khucluke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_loop=$(( ${{ github.event.inputs.loop_count }} - 1 ))
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/khucluke.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"loop_count\":\"$new_loop\"}}"