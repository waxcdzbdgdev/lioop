name: 🟢 Starter

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  start-bluebob:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.1
      - name: Panggil Bluebob
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bluebob.yml/dispatches \
            -d '{"ref":"main"}'